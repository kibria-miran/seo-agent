[project]
name = "seo-agent"
version = "0.1.0"
description = "UK mortgage SEO growth agent: deterministic audit layer, keyword gap analysis, prioritised backlog."
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "typer>=0.9",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]
tokens = ["tiktoken>=0.7"]

[project.scripts]
seo-agent = "src.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.sources"]

[tool.setuptools.package-data]
src = ["resources/**"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -m 'not slow and not live'"
markers = [
    "fast: deterministic, no network, no real LLM",
    "slow: live network smoke test",
    "live: one real LLM call",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["third_party", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF",
    "S", "BLE", "TRY", "PLW", "PYI", "FURB", "ISC",
]
# TRY003: message-rich raises are this codebase's style.
# E501: long string/report lines are deliberate; isort keeps imports tidy.
# RUF001/002/003: the codebase handles Unicode deliberately (homoglyph
# folding in security.py, en/em dashes in report copy).
ignore = ["TRY003", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# assert and subprocess use are the test idiom.
"tests/**" = ["S101", "S603", "S607"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/typer.Argument in argument defaults are the documented typer idiom.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
